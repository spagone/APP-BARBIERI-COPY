services:
  - type: web
    name: mybarber-api
    runtime: node
    rootDir: server
    buildCommand: npm ci --include=dev && npm run prisma:generate
    startCommand: npm run prisma:push && npm start
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES_DAYS
        value: "30"
      - key: CORS_ORIGINS
        value: ""

  - type: web
    name: mybarber-admin
    runtime: static
    rootDir: admin-dashboard
    staticPublishPath: .
    autoDeploy: true

  - type: web
    name: mybarber-app
    runtime: static
    rootDir: barber-app
    buildCommand: npm ci && npx expo export --platform web --output-dir dist
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: EXPO_PUBLIC_API_BASE_URL
        value: https://mybarber-api.onrender.com

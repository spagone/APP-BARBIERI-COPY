services:
  - type: web
    name: mybarber-api
    runtime: node
    rootDir: server
    buildCommand: npm ci && npm run prisma:generate
    preDeployCommand: npm run prisma:push
    startCommand: npm start
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES_DAYS
        value: "30"
      - key: CORS_ORIGINS
        value: https://mybarber-admin.onrender.com,https://mybarber-app.onrender.com
      - key: ADMIN_API_KEY
        sync: false
      - key: ADMIN_BOOTSTRAP_NAME
        value: MyBarber Super Admin
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_REPLY_TO
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_IDS
        sync: false
      - key: APPLE_CLIENT_IDS
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false

  - type: web
    name: mybarber-admin
    runtime: static
    rootDir: admin-dashboard
    staticPublishPath: .
    autoDeploy: true

  - type: web
    name: mybarber-app
    runtime: static
    rootDir: barber-app
    buildCommand: npm ci && npx expo export --platform web --output-dir dist
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: EXPO_PUBLIC_API_BASE_URL
        value: https://mybarber-api.onrender.com
